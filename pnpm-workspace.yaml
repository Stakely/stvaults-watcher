allowBuilds:
  esbuild: true

# Supply chain: only install packages published at least 7 days ago.
# Blocks zero-day malicious releases (e.g. the nx, event-stream, ua-parser-js incidents).
# Value is in minutes: 7 days × 24 h × 60 min = 10080.
minimumReleaseAge: 10080

# El default de pnpm para esta opcion es `true`, y con `true` pnpm no falla
# cuando el metadata de un paquete no trae el campo "time": avisa con un WARN
# ("skipping the minimumReleaseAge check for this package") e instala esa
# version sin comprobar su edad. En false la politica es fail-closed: si no se
# puede verificar la edad, el install se para en vez de seguir.
minimumReleaseAgeIgnoreMissingTime: false

# Fallar el install si el Node en uso no cumple `engines`, en vez de avisar y
# seguir. Sin esto la declaracion de engines es decorativa: un Node 20 instalaba
# igual @prometheus-io/client, que pide ^22 || ^24 || >=26.
engineStrict: true
